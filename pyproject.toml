[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardianloop"
version = "0.1.0"
description = "Autonomous multi-agent pipeline for detecting, patching, and adversarially verifying security vulnerabilities in C++ and Python code."
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "GuardianLoop Team" }]
dependencies = [
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.2,<0.4",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "google-genai>=1,<2",
    "httpx>=0.27,<1",
    "structlog>=24.1,<26",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "docker>=7,<8",
    "fastapi>=0.110,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.29,<1",
    "rich>=13,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.12,<4",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6,<7",
]

[project.scripts]
guardianloop = "guardianloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "integration: tests that require external services (WSL, Docker, network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
