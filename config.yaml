# Gemini models.
#   fixer_model           — primary model the Fixer agent calls.
#   fixer_fallback_model  — auto-downgrade target when all keys are exhausted
#                           on the primary model. Set to "" to disable fallback.
#   classifier_model      — for Classifier's optional LLM enrichment path.
# Multi-key rotation (GOOGLE_API_KEY_2/_3/... in .env) cycles within each
# model before the cascade switches to the fallback.
model_name: "gemini-2.5-pro"
fixer_model: "gemini-2.5-pro"
fixer_fallback_model: "gemini-2.5-flash"
classifier_model: "gemini-2.5-flash"

# Pipeline bounds
max_loop_iterations: 3

# Timeouts (seconds)
scout_timeout_seconds: 60
gemini_timeout_seconds: 120
sandbox_timeout_seconds: 30
nvd_timeout_seconds: 10

# Sandbox images (built via `make docker-build`)
python_sandbox_image: "guardianloop/python-sandbox:latest"
cpp_sandbox_image: "guardianloop/cpp-sandbox:latest"

# NVD API rate limits per 30s window
nvd_rate_limit_without_key: 5
nvd_rate_limit_with_key: 50

# Output
runs_dir: "./runs"
