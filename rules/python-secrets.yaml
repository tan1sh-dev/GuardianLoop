rules:
  - id: python-cwe798-hardcoded-secrets
    languages: [python]
    severity: ERROR
    message: >
      Hardcoded credentials or secrets were detected. Never store secrets, passwords,
      or API keys directly in source code (CWE-798).
    metadata:
      cwe: CWE-798
    patterns:
      - pattern: $SECRET = "..."
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i).*(secret|password|passwd|pwd|key|token|auth).*
