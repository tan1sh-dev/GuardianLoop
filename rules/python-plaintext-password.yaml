rules:
  - id: python-cwe327-plaintext-password
    languages: [python]
    severity: ERROR
    message: >
      Plaintext password comparison detected. Passwords should be hashed and 
      verified using a secure library like `bcrypt` (CWE-327).
    metadata:
      cwe: CWE-327
    patterns:
      - pattern-either:
          - pattern: $PWD == $OTHER
          - pattern: $OTHER == $PWD
          - pattern: $PWD != $OTHER
          - pattern: $OTHER != $PWD
      - metavariable-regex:
          metavariable: $PWD
          regex: (?i).*(password|passwd|pwd).*
