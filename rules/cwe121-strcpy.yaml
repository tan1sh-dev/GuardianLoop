rules:
  - id: cwe-121-strcpy-no-bounds
    patterns:
      - pattern: strcpy($DST, $SRC)
    message: >
      CWE-121: Stack-based buffer overflow. strcpy() does not check bounds.
      Use strncpy() or strlcpy() with explicit size limits.
    languages: [cpp, c]
    severity: ERROR
    metadata:
      cwe: CWE-121
      confidence: HIGH